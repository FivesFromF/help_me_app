name: help_me_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  phosphor_flutter: ^2.0.0
  go_router: ^14.7.2
  http: ^1.1.0
  url_launcher: ^6.2.1

  # Local Storage
  shared_preferences: ^2.3.2

  # AWS Amplify
  amplify_flutter: ^2.0.0
  amplify_auth_cognito: ^2.0.0

  # Hardware
  flutter_nfc_kit: ^3.6.2
  ndef: ^0.4.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.11.0
  image: ^4.2.0
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/screenshots/VerifyIdentity/

